<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>SnakeX</title>
  <link rel="icon" href="favicon.jpg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{ --c1:#00ffe0; --c2:#ff3cac; --c3:#f7b731; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ width:100%; height:100%; overflow:hidden; font-family:'Exo 2',sans-serif; color:#fff; }
    body{ display:flex; flex-direction:column; align-items:center; justify-content:center; background:#050510; }

    #hud{
      position:fixed; top:0; left:0; right:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 14px; gap:8px;
      background:rgba(0,0,0,.65); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .hud-stat{ display:flex; flex-direction:column; align-items:center; min-width:60px; }
    .hud-label{ font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.32); }
    .hud-val{ font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; line-height:1; color:var(--c1); }
    .hud-center{ display:flex; align-items:center; gap:10px; }

    .icon-btn{
      background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
      border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px;
      color:rgba(255,255,255,.7); transition:all .2s; white-space:nowrap;
      font-family:'Exo 2',sans-serif; -webkit-tap-highlight-color:transparent;
      user-select:none;
    }
    .icon-btn:hover { background:rgba(255,255,255,.14); color:#fff; }
    .icon-btn:active{ transform:scale(.95); }

    /* mode indicator pills */
    .mode-pills { display:flex; gap:4px; }
    .pill {
      font-size:8px; letter-spacing:1px; padding:2px 6px; border-radius:20px;
      background:rgba(255,255,255,.08); color:rgba(255,255,255,.45);
    }
    .pill.active { background:rgba(0,255,224,.2); color:var(--c1); }

    .speed-track{ width:60px; height:4px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden; }
    .speed-fill { height:100%; background:var(--c3); border-radius:4px; transition:width .3s; width:0%; }
    .hud-speed-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; }

    #arena{
      position:relative; display:flex; align-items:center; justify-content:center;
      width:100%; flex:1; padding-top:52px;
    }
    #game-canvas{ display:block; border-radius:4px; image-rendering:pixelated; }

    .overlay{
      position:fixed; inset:0; z-index:20;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.78); backdrop-filter:blur(8px);
    }
    .overlay.hidden{ display:none; }
    .modal{
      background:rgba(8,8,20,.96); border:1px solid rgba(0,255,224,.22);
      border-radius:20px; padding:28px 24px; text-align:center;
      min-width:260px; max-width:92vw;
      animation:scaleIn .22s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes scaleIn{ from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }

    .modal-title{ font-family:'Rajdhani',sans-serif; font-size:30px; font-weight:700; margin-bottom:4px; }
    .modal-sub{ font-size:12px; color:rgba(255,255,255,.38); margin-bottom:20px; }
    .modal-score-row{ display:flex; justify-content:space-around; margin-bottom:20px; }
    .modal-score-item .lbl{ font-size:9px; letter-spacing:2px; color:rgba(255,255,255,.32); }
    .modal-score-item .val{ font-family:'Rajdhani',sans-serif; font-size:28px; font-weight:700; color:var(--c1); }

    .btn-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .mbtn{
      padding:11px 20px; border-radius:10px; border:none;
      font-family:'Exo 2',sans-serif; font-size:13px; font-weight:700;
      cursor:pointer; transition:all .2s; letter-spacing:1px;
      -webkit-tap-highlight-color:transparent;
    }
    .mbtn-primary  { background:var(--c1); color:#000; }
    .mbtn-primary:hover { filter:brightness(1.15); }
    .mbtn-secondary{ background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.14); }
    .mbtn-secondary:hover{ background:rgba(255,255,255,.14); }
    .mbtn:active{ transform:scale(.95); }

    .new-record{
      display:inline-block; background:linear-gradient(135deg,var(--c3),#ff6b35);
      color:#000; font-size:10px; font-weight:700; letter-spacing:2px;
      padding:3px 10px; border-radius:20px; text-transform:uppercase; margin-bottom:14px;
    }

    /* mode info in modal */
    .mode-info-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
    .mode-badge {
      font-size:9px; padding:3px 8px; border-radius:12px;
      background:rgba(255,255,255,.08); color:rgba(255,255,255,.5);
      letter-spacing:1px;
    }
    .mode-badge.wrap { background:rgba(0,255,224,.15); color:var(--c1); }
    .mode-badge.pass { background:rgba(247,183,49,.15); color:var(--c3); }
    .mode-badge.obstacle { background:rgba(255,60,172,.15); color:var(--c2); }

    #dpad{
      position:fixed; bottom:0; left:0; right:0;
      display:none; flex-direction:column; align-items:center;
      padding:6px 0 10px; gap:4px; z-index:5; pointer-events:none;
      background:rgba(0,0,0,.4);
    }
    #dpad.visible{ display:flex; }
    .dpad-row{ display:flex; gap:4px; pointer-events:all; }
    .dpad-btn{
      width:68px; height:52px;
      background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14);
      border-radius:10px; display:flex; align-items:center; justify-content:center;
      font-size:20px; cursor:pointer; user-select:none;
      -webkit-tap-highlight-color:transparent; transition:background .1s;
    }
    .dpad-btn:active{ background:rgba(0,255,224,.22); }

    .score-popup{
      position:fixed; font-family:'Rajdhani',sans-serif;
      font-size:20px; font-weight:700; color:var(--c3);
      pointer-events:none; z-index:15;
      animation:popUp .7s ease forwards;
    }
    @keyframes popUp{ 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-44px) scale(.6)} }

    @keyframes flashRing{
      0%,100%{outline:3px solid transparent}
      40%{outline:3px solid var(--c3); outline-offset:2px}
    }
    .speed-flash{ animation:flashRing .45s ease; }

    @media(max-height:500px){
      .hud-val{ font-size:18px; }
      .dpad-btn{ width:56px; height:44px; font-size:17px; }
    }
  </style>
</head>
<body>

  <div id="hud">
    <div class="hud-stat">
      <div class="hud-label" id="lbl-score">Score</div>
      <div class="hud-val"   id="score-val">0</div>
    </div>
    <div class="hud-center">
      <div class="icon-btn" onclick="doMenu()">🏠</div>
      <div class="hud-speed-wrap">
        <div class="hud-label" id="lbl-speed">Speed</div>
        <div class="speed-track"><div class="speed-fill" id="speed-fill"></div></div>
      </div>
      <div class="icon-btn" onclick="doPause()" id="pause-btn">⏸</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label" id="lbl-best">Best</div>
      <div class="hud-val"   id="best-val">0</div>
    </div>
  </div>

  <div id="arena">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="dpad">
    <div class="dpad-row"><div class="dpad-btn" id="btn-up">▲</div></div>
    <div class="dpad-row">
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-down">▼</div>
      <div class="dpad-btn" id="btn-right">▶</div>
    </div>
  </div>

  <!-- PAUSE -->
  <div class="overlay hidden" id="pause-overlay">
    <div class="modal">
      <div class="modal-title" id="lbl-pause">Pause</div>
      <div class="modal-sub"   id="pause-mode-lbl"></div>
      <div class="btn-row">
        <button class="mbtn mbtn-primary"   onclick="doResume()"  id="lbl-resume">Resume</button>
        <button class="mbtn mbtn-secondary" onclick="doRestart()" id="lbl-restart">Restart</button>
        <button class="mbtn mbtn-secondary" onclick="doMenu()"    id="lbl-exit">Menu</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="gameover-overlay">
    <div class="modal">
      <div class="modal-title" style="color:var(--c2)">💀</div>
      <div class="modal-title" id="lbl-gameover">Game Over</div>
      <div id="new-record-badge" class="new-record" style="display:none">🏆 NEW RECORD!</div>
      <div class="modal-score-row">
        <div class="modal-score-item"><div class="lbl" id="lbl-score2">Score</div><div class="val" id="go-score">0</div></div>
        <div class="modal-score-item"><div class="lbl" id="lbl-best2">Best</div><div class="val" id="go-best">0</div></div>
      </div>
      <!-- Mode info badges -->
      <div class="mode-info-row" id="mode-info-row"></div>
      <div class="btn-row">
        <button class="mbtn mbtn-primary"   onclick="doRestart()" id="lbl-again">Play Again</button>
        <button class="mbtn mbtn-secondary" onclick="doMenu()"    id="lbl-exit2">Menu</button>
      </div>
    </div>
  </div>

  <script>
  // ═══════════════════════════════════════════════════
  //  i18n
  // ═══════════════════════════════════════════════════
  const LANGS={
    en:{score:'Score',best:'Best',speed:'Speed',pause:'Pause',resume:'Resume',
        restart:'Restart',exit:'Menu',gameover:'Game Over',again:'Play Again',
        mode_classic:'Classic',mode_neo:'NeoSnake',mode_neon:'Neon 3D',new_record:'🏆 NEW RECORD!',
        wrap_on:'Wrap ON', wrap_off:'Wrap OFF', pass_on:'Ghost Tail', die_tail:'Solid Tail',
        map_open:'Open Map', map_building:'Building', map_walls:'Wall Map',
    },
    ru:{score:'Счёт',best:'Рекорд',speed:'Скорость',pause:'Пауза',resume:'Продолжить',
        restart:'Заново',exit:'Меню',gameover:'Игра Окончена',again:'Ещё раз',
        mode_classic:'Классика',mode_neo:'НеоЗмейка',mode_neon:'Неон 3D',new_record:'🏆 НОВЫЙ РЕКОРД!',
        wrap_on:'Обход стен ВКЛ', wrap_off:'Стена = Смерть', pass_on:'Сквозь хвост', die_tail:'Хвост убивает',
        map_open:'Пустая карта', map_building:'Здание', map_walls:'Стены на карте',
    },
    uz:{score:'Ball',best:'Rekord',speed:'Tezlik',pause:'Pauza',resume:'Davom',
        restart:'Qayta',exit:'Menyu',gameover:"O'yin tugadi",again:"Yana o'yna",
        mode_classic:'Klassik',mode_neo:'NeoIlon',mode_neon:'Neon 3D',new_record:'🏆 YANGI REKORD!',
        wrap_on:"Devor o'tish YOQ", wrap_off:"Devor = O'lim", pass_on:'Dum orqali', die_tail:"Dum o'ldiradi",
        map_open:'Ochiq xarita', map_building:'Bino', map_walls:'Devorli xarita',
    },
  };

  const THEMES={
    dark:{ body:'#050510', canvasBg:'#0a0a1e', cell:'rgba(255,255,255,0.04)' },
    cyber:{ body:'#010820', canvasBg:'#00091a', cell:'rgba(0,160,255,0.06)' },
    forest:{ body:'#030e03', canvasBg:'#051405', cell:'rgba(0,180,60,0.06)' },
    lava:{ body:'#0e0300', canvasBg:'#1a0400', cell:'rgba(220,70,0,0.07)' },
  };

  // ═══════════════════════════════════════════════════
  //  CONFIG
  // ═══════════════════════════════════════════════════
  let cfg={lang:'en',mode:'neo',diff:'medium',volume:70,theme:'dark',
           mapSize:20, mapType:'open', wallMode:'die', tailMode:'die'};
  try{ Object.assign(cfg,JSON.parse(localStorage.getItem('snakex-cfg')||'{}')); }catch(e){}

  const DIFF_SPEED={slow:170,medium:115,fast:70};
  const APPLES_PER_LEVEL=5;

  // ═══════════════════════════════════════════════════
  //  CANVAS & GRID
  // ═══════════════════════════════════════════════════
  const canvas=document.getElementById('game-canvas');
  const ctx=canvas.getContext('2d');

  // GRID is computed from mapSize to fit the screen
  let GRID=22;
  let TC=cfg.mapSize; // tile count

  function isMobile(){
    return ('ontouchstart' in window||navigator.maxTouchPoints>0) && window.innerWidth<900;
  }

  function sizeCanvas(){
    const hudH=document.getElementById('hud').getBoundingClientRect().height||52;
    const dpadH=isMobile()?130:0;
    const availW=window.innerWidth-8;
    const availH=window.innerHeight-hudH-dpadH-8;
    const maxSide=Math.min(availW,availH);
    TC=cfg.mapSize;
    GRID=Math.floor(maxSide/TC);
    if(GRID<8) GRID=8;
    canvas.width=GRID*TC;
    canvas.height=GRID*TC;
    const th=THEMES[cfg.theme]||THEMES.dark;
    document.body.style.background=th.body;
  }

  // ═══════════════════════════════════════════════════
  //  OBSTACLE MAPS
  //  Each map type × each map size has a unique building/wall layout
  // ═══════════════════════════════════════════════════
  function getObstacles(){
    if(cfg.mapType==='open') return [];
    const tc=TC;
    const mid=Math.floor(tc/2);

    if(cfg.mapType==='building'){
      // A building/structure in the center — varies by map size
      const obstacles=[];
      if(tc<=5){
        // Small: a single 1-cell pillar in center
        obstacles.push({x:mid,y:mid});
      } else if(tc<=10){
        // Medium: a 2×2 block in center
        for(let dx=0;dx<2;dx++) for(let dy=0;dy<2;dy++)
          obstacles.push({x:mid-1+dx, y:mid-1+dy});
        // small doorway (gap) — corners only, open sides
      } else if(tc<=15){
        // 15: hollow 3×3 building (8 cells)
        for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
          if(dx===0&&dy===0) continue; // hollow inside
          obstacles.push({x:mid+dx, y:mid+dy});
        }
      } else {
        // 20: large L-shaped building with courtyard
        // Perimeter of 5×5 with one open entrance
        const s=Math.floor(tc*0.2);
        for(let dx=0;dx<s;dx++){
          for(let dy=0;dy<s;dy++){
            const isPerim = dx===0||dx===s-1||dy===0||dy===s-1;
            const isEntrance = (dx===s-1 && (dy===1||dy===2)); // right wall entrance
            if(isPerim && !isEntrance)
              obstacles.push({x:mid-Math.floor(s/2)+dx, y:mid-Math.floor(s/2)+dy});
          }
        }
      }
      return obstacles;
    }

    if(cfg.mapType==='walls'){
      // Inner walls / corridors — varies by map size
      const obstacles=[];
      if(tc<=5){
        // single horizontal bar in center (1 cell tall, 3 wide but leave 1 gap)
        obstacles.push({x:1,y:mid},{x:2,y:mid});
        obstacles.push({x:tc-2,y:mid},{x:tc-3,y:mid});
      } else if(tc<=10){
        // 4 short walls toward center from each corner
        const off=2;
        // top-left vertical
        for(let i=1;i<off+1;i++) obstacles.push({x:off,y:i});
        // bottom-right vertical
        for(let i=tc-off-2;i<tc-1;i++) obstacles.push({x:tc-off-1,y:i});
        // top-right horizontal
        for(let i=tc-off-1;i<tc-1;i++) obstacles.push({x:i,y:off});
        // bottom-left horizontal
        for(let i=1;i<off+1;i++) obstacles.push({x:i,y:tc-off-1});
      } else if(tc<=15){
        // cross / plus shape in center
        for(let i=-3;i<=3;i++){
          if(i===0) continue; // gap in center
          obstacles.push({x:mid+i, y:mid});
          obstacles.push({x:mid, y:mid+i});
        }
      } else {
        // 4 diagonal corridors: walls radiating from center-ish, with gaps
        const arm=Math.floor(tc*0.18);
        for(let i=1;i<=arm;i++){
          // NW diagonal strip (vertical part)
          obstacles.push({x:mid-i,y:mid-i});
          // NE
          obstacles.push({x:mid+i,y:mid-i});
          // SW
          obstacles.push({x:mid-i,y:mid+i});
          // SE
          obstacles.push({x:mid+i,y:mid+i});
        }
        // add center cross spurs
        for(let i=2;i<=3;i++){
          obstacles.push({x:mid+i,y:mid});
          obstacles.push({x:mid-i,y:mid});
          obstacles.push({x:mid,y:mid+i});
          obstacles.push({x:mid,y:mid-i});
        }
      }
      return obstacles;
    }
    return [];
  }

  // ═══════════════════════════════════════════════════
  //  GAME STATE
  // ═══════════════════════════════════════════════════
  let snake,direction,nextDir,apple,score,applesEaten;
  let baseSpeed,speed,gameLoop,isDead,isPaused;
  let obstacles=[];
  let obstacleSet=new Set(); // fast lookup: "x,y"

  function getHS(){ return Number(localStorage.getItem('snakex-highscore')||0); }
  function saveHS(s){ if(s>getHS()){ localStorage.setItem('snakex-highscore',s); return true; } return false; }

  function obsKey(x,y){ return `${x},${y}`; }

  function isObs(x,y){ return obstacleSet.has(obsKey(x,y)); }

  function spawnApple(){
    let a;
    do{
      a={x:Math.floor(Math.random()*TC), y:Math.floor(Math.random()*TC)};
    }while(snake.some(s=>s.x===a.x&&s.y===a.y) || isObs(a.x,a.y));
    return a;
  }

  function initGame(){
    sizeCanvas();
    obstacles=getObstacles();
    obstacleSet=new Set(obstacles.map(o=>obsKey(o.x,o.y)));

    const mid=Math.floor(TC/2);
    // Start away from center if building is there
    let sx=Math.max(1,Math.floor(TC*0.15));
    let sy=mid;
    // make sure start isn't in obstacle
    while(isObs(sx,sy)){ sx++; }

    snake=[{x:sx,y:sy}];
    direction={x:1,y:0}; nextDir={x:1,y:0};
    apple=spawnApple();
    score=0; applesEaten=0;
    baseSpeed=DIFF_SPEED[cfg.diff]||115;
    speed=baseSpeed;
    isDead=false; isPaused=false;
    document.getElementById('score-val').textContent=0;
    document.getElementById('best-val').textContent=getHS();
    document.getElementById('gameover-overlay').classList.add('hidden');
    document.getElementById('pause-overlay').classList.add('hidden');
    document.getElementById('speed-fill').style.width='0%';
    clearInterval(gameLoop);
    gameLoop=setInterval(tick,speed);
    applyI18n();
    showDpad();
    draw();
  }

  // ─── TICK ──────────────────────────────────────────
  function tick(){
    if(isDead||isPaused) return;
    direction={...nextDir};
    let nx=snake[0].x+direction.x;
    let ny=snake[0].y+direction.y;

    // Border handling
    if(cfg.wallMode==='wrap'){
      nx=((nx%TC)+TC)%TC;
      ny=((ny%TC)+TC)%TC;
    } else {
      if(nx<0||nx>=TC||ny<0||ny>=TC){
        playSound(deathAudio); doGameOver(); return;
      }
    }

    // Obstacle collision (always kills regardless of wallMode)
    if(isObs(nx,ny)){
      playSound(deathAudio); doGameOver(); return;
    }

    // Tail collision
    if(cfg.tailMode==='die'){
      if(snake.some(s=>s.x===nx&&s.y===ny)){
        playSound(deathAudio); doGameOver(); return;
      }
    } else {
      // pass: skip tail collision check
    }

    const head={x:nx,y:ny};
    snake.unshift(head);
    if(head.x===apple.x&&head.y===apple.y){
      score+=10; applesEaten++;
      apple=spawnApple();
      document.getElementById('score-val').textContent=score;
      playSound(eatAudio);
      showScorePopup(head);
      checkSpeedUp();
    } else snake.pop();
    draw();
  }

  function checkSpeedUp(){
    const fill=((applesEaten%APPLES_PER_LEVEL)/APPLES_PER_LEVEL)*100;
    document.getElementById('speed-fill').style.width=fill+'%';
    if(applesEaten%APPLES_PER_LEVEL===0){
      const lvl=Math.floor(applesEaten/APPLES_PER_LEVEL);
      speed=Math.max(38, baseSpeed-lvl*14);
      clearInterval(gameLoop); gameLoop=setInterval(tick,speed);
      canvas.classList.remove('speed-flash');
      void canvas.offsetWidth;
      canvas.classList.add('speed-flash');
      document.getElementById('speed-fill').style.width='0%';
    }
  }

  function doGameOver(){
    isDead=true; clearInterval(gameLoop);
    const isNew=saveHS(score);
    document.getElementById('go-score').textContent=score;
    document.getElementById('go-best').textContent=getHS();
    document.getElementById('best-val').textContent=getHS();
    document.getElementById('new-record-badge').style.display=isNew?'inline-block':'none';
    // Show mode badges
    buildModeBadges();
    drawDeathFlash();
    setTimeout(()=>{ document.getElementById('gameover-overlay').classList.remove('hidden'); },480);
  }

  function buildModeBadges(){
    const T=LANGS[cfg.lang]||LANGS.en;
    const row=document.getElementById('mode-info-row');
    row.innerHTML='';
    // wall mode
    const wb=document.createElement('div');
    wb.className='mode-badge'+(cfg.wallMode==='wrap'?' wrap':'');
    wb.textContent=cfg.wallMode==='wrap'?T.wrap_on:T.wrap_off;
    row.appendChild(wb);
    // tail mode
    const tb=document.createElement('div');
    tb.className='mode-badge'+(cfg.tailMode==='pass'?' pass':'');
    tb.textContent=cfg.tailMode==='pass'?T.pass_on:T.die_tail;
    row.appendChild(tb);
    // map type
    if(cfg.mapType!=='open'){
      const mb=document.createElement('div');
      mb.className='mode-badge obstacle';
      mb.textContent=cfg.mapType==='building'?T.map_building:T.map_walls;
      row.appendChild(mb);
    }
  }

  function doPause(){
    if(isDead) return;
    isPaused=true;
    document.getElementById('pause-overlay').classList.remove('hidden');
    document.getElementById('pause-btn').textContent='▶';
  }
  function doResume(){
    isPaused=false;
    document.getElementById('pause-overlay').classList.add('hidden');
    document.getElementById('pause-btn').textContent='⏸';
  }
  function doRestart(){
    document.getElementById('pause-overlay').classList.add('hidden');
    initGame();
  }
  function doMenu(){
    clearInterval(gameLoop);
    document.body.style.opacity='0'; document.body.style.transition='opacity .25s';
    setTimeout(()=>{ window.location.href='index.html'; },250);
  }

  // ═══════════════════════════════════════════════════
  //  DRAWING
  // ═══════════════════════════════════════════════════
  function drawBgGrid(){
    const th=THEMES[cfg.theme]||THEMES.dark;
    ctx.fillStyle=th.canvasBg;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle=th.cell;
    ctx.lineWidth=1;
    for(let x=0;x<=TC;x++){
      ctx.beginPath(); ctx.moveTo(x*GRID,0); ctx.lineTo(x*GRID,canvas.height); ctx.stroke();
    }
    for(let y=0;y<=TC;y++){
      ctx.beginPath(); ctx.moveTo(0,y*GRID); ctx.lineTo(canvas.width,y*GRID); ctx.stroke();
    }
  }

  function drawObstacles(){
    if(obstacles.length===0) return;
    obstacles.forEach(o=>{
      const px=o.x*GRID, py=o.y*GRID;
      if(cfg.mapType==='building'){
        // Draw as brick wall
        ctx.fillStyle='#5a3e28';
        ctx.fillRect(px+1,py+1,GRID-2,GRID-2);
        // brick highlight
        ctx.fillStyle='#7a5538';
        ctx.fillRect(px+2,py+2,GRID-4,3);
        ctx.fillRect(px+2,py+2,3,GRID-4);
        // shadow
        ctx.fillStyle='#3a2510';
        ctx.fillRect(px+GRID-4,py+2,3,GRID-4);
        ctx.fillRect(px+2,py+GRID-4,GRID-4,3);
      } else {
        // Wall: grey stone
        ctx.fillStyle='#555566';
        ctx.fillRect(px+1,py+1,GRID-2,GRID-2);
        ctx.fillStyle='#777788';
        ctx.fillRect(px+2,py+2,GRID-5,3);
        ctx.fillRect(px+2,py+2,3,GRID-5);
        ctx.fillStyle='#333344';
        ctx.fillRect(px+GRID-4,py+2,3,GRID-4);
        ctx.fillRect(px+2,py+GRID-4,GRID-4,3);
      }
    });
  }

  function draw(){
    const m=cfg.mode;
    if(m==='classic') drawClassic();
    else if(m==='neo') drawNeo();
    else drawNeon();
    drawObstacles();
  }

  // ── CLASSIC ──────────────────────────────────────
  function drawClassic(){
    drawBgGrid();
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?'#3aff3a':'#c7b948';
      ctx.fillRect(s.x*GRID+1,s.y*GRID+1,GRID-2,GRID-2);
      if(i===0) drawEyes(s);
    });
    const ax=apple.x*GRID, ay=apple.y*GRID;
    ctx.fillStyle='#dd2020';
    ctx.fillRect(ax+2,ay+2,GRID-4,GRID-4);
    ctx.fillStyle='rgba(255,255,255,.45)';
    ctx.fillRect(ax+4,ay+4,4,3);
  }

  // ── NEO ───────────────────────────────────────────
  function drawNeo(){
    drawBgGrid();
    snake.forEach((s,i)=>{
      const t=1-i/snake.length;
      ctx.fillStyle=i===0?'#44ee44':`rgba(80,${Math.round(130+t*80)},60,${0.5+t*0.5})`;
      ctx.fillRect(s.x*GRID+1,s.y*GRID+1,GRID-2,GRID-2);
      if(i===0) drawEyes(s);
    });
    ctx.fillStyle='#cc3333';
    ctx.beginPath();
    ctx.arc(apple.x*GRID+GRID/2, apple.y*GRID+GRID/2, GRID/2.3, 0, 2*Math.PI);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath();
    ctx.arc(apple.x*GRID+GRID/2-2, apple.y*GRID+GRID/2-2, GRID/7, 0, 2*Math.PI);
    ctx.fill();
  }

  // ── NEON ─────────────────────────────────────────
  function drawNeon(){
    ctx.fillStyle='rgba(0,0,0,.32)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // redraw grid faintly
    const th=THEMES[cfg.theme]||THEMES.dark;
    ctx.strokeStyle=th.cell;
    ctx.lineWidth=1;
    for(let x=0;x<=TC;x++){ctx.beginPath();ctx.moveTo(x*GRID,0);ctx.lineTo(x*GRID,canvas.height);ctx.stroke();}
    for(let y=0;y<=TC;y++){ctx.beginPath();ctx.moveTo(0,y*GRID);ctx.lineTo(canvas.width,y*GRID);ctx.stroke();}

    snake.forEach((s,i)=>{
      const t=1-i/snake.length;
      if(i===0){
        ctx.shadowBlur=18; ctx.shadowColor='#00ffff';
        ctx.fillStyle='#00ffff';
      } else {
        ctx.shadowBlur=10*t; ctx.shadowColor=`rgba(0,180,220,${t})`;
        ctx.fillStyle=`rgba(0,${Math.round(120+t*100)},${Math.round(160+t*60)},${0.55+t*0.45})`;
      }
      ctx.fillRect(s.x*GRID+1,s.y*GRID+1,GRID-2,GRID-2);
      if(i===0){ ctx.shadowBlur=0; drawEyes(s); }
    });
    ctx.shadowBlur=0;
    ctx.shadowBlur=22; ctx.shadowColor='#ff1177';
    ctx.fillStyle='#ff1177';
    ctx.beginPath();
    ctx.arc(apple.x*GRID+GRID/2, apple.y*GRID+GRID/2, GRID/2.3, 0, 2*Math.PI);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.arc(apple.x*GRID+GRID/2-2, apple.y*GRID+GRID/2-3, GRID/8, 0, 2*Math.PI);
    ctx.fill();
  }

  function drawEyes(s){
    if(GRID<8) return; // too small to draw eyes
    const e=Math.max(1,Math.floor(GRID/5)), px=s.x*GRID, py=s.y*GRID;
    ctx.fillStyle='#000';
    const d=direction;
    if(d.x===1){
      ctx.fillRect(px+GRID*.65,py+GRID*.22,e,e);
      ctx.fillRect(px+GRID*.65,py+GRID*.58,e,e);
    } else if(d.x===-1){
      ctx.fillRect(px+GRID*.10,py+GRID*.22,e,e);
      ctx.fillRect(px+GRID*.10,py+GRID*.58,e,e);
    } else if(d.y===-1){
      ctx.fillRect(px+GRID*.22,py+GRID*.10,e,e);
      ctx.fillRect(px+GRID*.58,py+GRID*.10,e,e);
    } else {
      ctx.fillRect(px+GRID*.22,py+GRID*.65,e,e);
      ctx.fillRect(px+GRID*.58,py+GRID*.65,e,e);
    }
  }

  function drawDeathFlash(){
    draw();
    ctx.fillStyle='rgba(255,0,0,.22)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // ═══════════════════════════════════════════════════
  //  AUDIO
  // ═══════════════════════════════════════════════════
  let eatAudio,deathAudio;
  function loadSounds(){
    eatAudio=new Audio('eat.mp3'); deathAudio=new Audio('death.mp3');
  }
  function playSound(a){
    if(!a) return;
    try{
      const c=a.cloneNode(); c.volume=cfg.volume/100;
      c.play().catch(()=>{});
    }catch(e){}
  }

  // ═══════════════════════════════════════════════════
  //  CONTROLS
  // ═══════════════════════════════════════════════════
  const DIRS={
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1},
    ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
    ц:{x:0,y:-1}, ы:{x:0,y:1}, ф:{x:-1,y:0}, в:{x:1,y:0},
  };
  function tryDir(d){
    if(isPaused||isDead) return;
    if(d.x!==0&&d.x===-direction.x) return;
    if(d.y!==0&&d.y===-direction.y) return;
    nextDir=d;
  }

  window.addEventListener('keydown',e=>{
    if(['ё','Ё','`','~','Escape'].includes(e.key)){
      isPaused?doResume():doPause(); return;
    }
    if(DIRS[e.key]){ e.preventDefault(); tryDir(DIRS[e.key]); }
  });

  let tx0=0,ty0=0;
  canvas.addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; e.preventDefault(); },{passive:false});
  canvas.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
    if(Math.abs(dx)<18&&Math.abs(dy)<18) return;
    if(Math.abs(dx)>Math.abs(dy)) tryDir(dx>0?{x:1,y:0}:{x:-1,y:0});
    else tryDir(dy>0?{x:0,y:1}:{x:0,y:-1});
    e.preventDefault();
  },{passive:false});

  function showDpad(){
    document.getElementById('dpad').classList.toggle('visible',isMobile());
  }
  const DPAD_MAP={
    'btn-up':{x:0,y:-1},'btn-down':{x:0,y:1},
    'btn-left':{x:-1,y:0},'btn-right':{x:1,y:0},
  };
  Object.entries(DPAD_MAP).forEach(([id,dir])=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{ e.preventDefault(); tryDir(dir); },{passive:false});
    el.addEventListener('click',()=>tryDir(dir));
  });

  // ═══════════════════════════════════════════════════
  //  SCORE POPUP
  // ═══════════════════════════════════════════════════
  function showScorePopup(cell){
    const rect=canvas.getBoundingClientRect();
    const el=document.createElement('div');
    el.className='score-popup';
    el.textContent='+10';
    el.style.left=(rect.left+cell.x*GRID+GRID/2)+'px';
    el.style.top =(rect.top +cell.y*GRID)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),700);
  }

  // ═══════════════════════════════════════════════════
  //  I18N
  // ═══════════════════════════════════════════════════
  function applyI18n(){
    const T=LANGS[cfg.lang]||LANGS.en;
    document.getElementById('lbl-score').textContent =T.score;
    document.getElementById('lbl-score2').textContent=T.score;
    document.getElementById('lbl-best').textContent  =T.best;
    document.getElementById('lbl-best2').textContent =T.best;
    document.getElementById('lbl-speed').textContent =T.speed;
    document.getElementById('lbl-pause').textContent =T.pause;
    document.getElementById('lbl-resume').textContent=T.resume;
    document.getElementById('lbl-restart').textContent=T.restart;
    document.getElementById('lbl-exit').textContent  =T.exit;
    document.getElementById('lbl-exit2').textContent =T.exit;
    document.getElementById('lbl-gameover').textContent=T.gameover;
    document.getElementById('lbl-again').textContent =T.again;
    document.getElementById('new-record-badge').textContent=T.new_record;
    // pause subtitle: mode name
    const modes={classic:T.mode_classic,neo:T.mode_neo,neon:T.mode_neon};
    document.getElementById('pause-mode-lbl').textContent=modes[cfg.mode]||'';
  }

  // ═══════════════════════════════════════════════════
  //  RESIZE
  // ═══════════════════════════════════════════════════
  let resizeTimer;
  function onResize(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      sizeCanvas();
      if(!isDead) draw();
      showDpad();
    },120);
  }
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',()=>setTimeout(onResize,300));

  // ═══════════════════════════════════════════════════
  //  FULLSCREEN
  // ═══════════════════════════════════════════════════
  function tryFS(){
    const el=document.documentElement;
    const fn=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(fn) fn.call(el).catch(()=>{});
  }
  document.addEventListener('click',tryFS,{once:true});
  document.addEventListener('touchstart',tryFS,{once:true});
  setTimeout(tryFS,300);

  // ═══════════════════════════════════════════════════
  //  START
  // ═══════════════════════════════════════════════════
  loadSounds();
  initGame();
  </script>
</body>
</html>
